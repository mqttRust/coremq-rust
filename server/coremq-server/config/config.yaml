app:
  name: "coremq"
  env: "production"

middleware:
  model_path: /etc/coremq/model.conf
  policy_path: /etc/coremq/policy.csv
  secret: change-this-to-a-long-random-secret

mqtt:
  listeners:

    - name: "tcp"
      protocol: "tcp"
      host: "0.0.0.0"
      port: 1883

    - name: "ws"
      protocol: "ws"
      host: "0.0.0.0"
      port: 8083

    # Uncomment to enable TLS listeners (provide cert paths)
    # - name: "tls"
    #   protocol: "tls"
    #   host: "0.0.0.0"
    #   port: 8883
    #   tls:
    #     cert: "/etc/coremq/tls/server.crt"
    #     key:  "/etc/coremq/tls/server.key"

    # - name: "wss"
