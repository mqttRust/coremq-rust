[package]
name = "coremq-server"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
anyhow = "1.0.101"

dashmap = "5"

redb = "2"
bincode = "1"

jsonwebtoken = "9"
casbin = "2.20.0"

argon2 = "0.5"
password-hash = "0.5"
rand_core = "0.6"
sysinfo = { version = "0.29", default-features = false }
rust-embed = { version = "8", features = ["compression"] }
mime_guess = "2"

# Webhooks: outbound HTTP dispatch + optional HMAC signatures + ids
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

# TLS listeners (MQTT over TLS / WSS). Pin the ring crypto provider so the
# process default is unambiguous (reqwest also pulls aws-lc-rs into the graph).
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pemfile = "2"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }

# Self-signed certificate generation (for the TLS cert generator menu)
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
